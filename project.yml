name: ClipMaster
options:
  bundleIdPrefix: com.clipmaster
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"

packages:
  WhisperKit:
    url: https://github.com/argmaxinc/WhisperKit.git
    from: 0.9.0

targets:
  ClipMaster:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/ClipMaster
    dependencies:
      - package: WhisperKit
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: "ClipMaster"
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        NSPhotoLibraryUsageDescription: "ClipMaster necesita acceder a tu galería para seleccionar videos extensos y procesarlos."
        NSPhotoLibraryAddUsageDescription: "ClipMaster necesita permiso para guardar los clips exportados en tu fototeca."
        NSLocalNetworkUsageDescription: "ClipMaster necesita conectarse a tu Mac en la red local para el análisis con Gemini."
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.clipmaster.app
      CODE_SIGN_STYLE: Automatic
      ENABLE_USER_SCRIPT_SANDBOXING: NO
      SWIFT_VERSION: "5.9"
